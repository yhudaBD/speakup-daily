<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6C63FF" />
    <meta name="description" content="SpeakUp Daily — תרגול אנגלית יומי עם AI. הגייה, שיחות, ומעקב התקדמות." />

    <title>SpeakUp Daily</title>

    <!-- PWA / Add to Home Screen -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SpeakUp" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="SpeakUp" />
    <meta name="format-detection" content="telephone=no" />

    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: linear-gradient(135deg, #6C63FF 0%, #9C8FFF 100%);
        transition: opacity 0.4s ease;
      }
      #app-splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash svg {
        width: 96px;
        height: 96px;
        animation: splash-pulse 1.8s ease-in-out infinite;
      }
      #app-splash .splash-name {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-weight: 800;
        font-size: 20px;
        color: #ffffff;
        letter-spacing: 0.02em;
      }
      #app-splash .splash-dots {
        display: flex;
        gap: 6px;
      }
      #app-splash .splash-dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ffffff;
        opacity: 0.5;
        animation: splash-bounce 1s ease-in-out infinite;
      }
      #app-splash .splash-dots span:nth-child(2) { animation-delay: 0.15s; }
      #app-splash .splash-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes splash-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
        40% { transform: translateY(-6px); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <svg viewBox="0 0 512 512" fill="none">
        <path d="M148 148h216c22 0 40 18 40 40v108c0 22-18 40-40 40H228l-52 44c-8 7-20 1-20-10v-34h-8c-22 0-40-18-40-40V188c0-22 18-40 40-40z" fill="#ffffff" fill-opacity="0.95"/>
        <rect x="220" y="196" width="72" height="108" rx="36" fill="#6C63FF"/>
        <path d="M196 292c0 44 36 72 60 72s60-28 60-72" stroke="#6C63FF" stroke-width="16" stroke-linecap="round"/>
        <line x1="256" y1="364" x2="256" y2="396" stroke="#6C63FF" stroke-width="16" stroke-linecap="round"/>
        <line x1="216" y1="396" x2="296" y2="396" stroke="#6C63FF" stroke-width="16" stroke-linecap="round"/>
        <path d="M132 248c-12 16-12 40 0 56" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
        <path d="M96 224c-24 32-24 80 0 112" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
        <path d="M380 248c12 16 12 40 0 56" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
        <path d="M416 224c24 32 24 80 0 112" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
      </svg>
      <div class="splash-name">SpeakUp Daily</div>
      <div class="splash-dots"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
